services:
  frame-controller:
    image: frame-controller:1.2.0
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "568:568"
    environment:
      HOME: /data
      SCHEDULE_ENABLED: "false"
      TZ: America/Los_Angeles
      WEB_ENABLED: "true"
      WEB_SECURE_COOKIE: "false"
    ports:
      # Replace with your TrueNAS LAN IP; publish only on this interface.
      - "192.168.40.10:8080:8080"
    volumes:
      - /mnt/tank/apps/frame-controller/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
