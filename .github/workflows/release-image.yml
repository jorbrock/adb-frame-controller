name: Build release image

on:
  release:
    # Includes releases published after being saved as drafts.
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: frame-controller
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/frame-controller.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: frame-controller-linux-amd64
          path: ${{ runner.temp }}/frame-controller.tar
          if-no-files-found: error
          retention-days: 30
