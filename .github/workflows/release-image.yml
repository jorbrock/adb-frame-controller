name: Build release image

on:
  release:
    # Includes releases published after being saved as drafts.
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v

      - name: Prepare package image name
        id: package
        shell: python
        run: |
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
              release = json.load(event_file)["release"]
          name = (release.get("name") or "").strip() or release["tag_name"]
          # Docker tags allow letters, digits, underscores, periods and hyphens.
          tag = re.sub(r"[^a-zA-Z0-9_.-]+", "-", name).lstrip(".-")[:128]
          if not tag:
              raise SystemExit("Release name does not contain a valid Docker tag")
          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}:{tag}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output_file:
              output_file.write(f"image={image}\n")
          print(f"Package image: {image}")

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: frame-controller
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/frame-controller.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: frame-controller-linux-amd64
          path: ${{ runner.temp }}/frame-controller.tar
          if-no-files-found: error
          retention-days: 30

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub package
        env:
          SOURCE_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          PACKAGE_IMAGE: ${{ steps.package.outputs.image }}
        run: |
          docker load --input "$RUNNER_TEMP/frame-controller.tar"
          docker tag "$SOURCE_IMAGE" "$PACKAGE_IMAGE"
          docker push "$PACKAGE_IMAGE"
