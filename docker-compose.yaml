# TrueNAS Include Config:
# include:
#   - /mnt/BrockNetPoolSSD/AppConfigs/AdbFrameController/docker-compose.yaml
services:
  frame-controller:
    image: frame-controller:1.4.0
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "3019:3019"
    environment:
      HOME: /data
      SCHEDULE_ENABLED: "true"
      TZ: America/Los_Angeles
      WEB_ENABLED: "true"
      WEB_SECURE_COOKIE: "false"
    ports:
      - host_ip: 192.168.10.13
        mode: ingress
        protocol: tcp
        published: 80
        target: 8080
    volumes:
      - /mnt/BrockNetPoolSSD/AppConfigs/AdbFrameController/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
