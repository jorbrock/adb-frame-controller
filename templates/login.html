{% extends 'base.html' %}
{% block title %}Sign in · Frame Controller{% endblock %}
{% block content %}
<section class="login-panel">
  <p class="eyebrow">YOUR FRAMES, AT A GLANCE</p>
  <h1>Welcome back.</h1>
  <p class="intro">Sign in to check your frames and restart a slideshow.</p>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}" class="login-form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in <span aria-hidden="true">→</span></button>
  </form>
</section>
{% endblock %}
